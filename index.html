<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <title>Sovereign Project Radar & Audit</title>
  <style>
    :root {
      --bg: #090d13;
      --card-bg: rgba(18, 24, 34, 0.9);
      --card-border: rgba(48, 54, 61, 0.7);
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent-s: #2ea043;
      --accent-a: #388bfd;
      --accent-b: #d29922;
      --accent-c: #484f58;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 1.5rem;
      min-height: 100vh;
    }
    .container { max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 1.5rem; }
    
    .header-card {
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 1rem;
      padding: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }
    .header-top {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    @media (min-width: 768px) {
      .header-top { flex-direction: row; justify-content: space-between; align-items: center; }
    }
    .badges { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; margin-bottom: 0.5rem; }
    .tag-badge {
      font-family: monospace; font-size: 0.7rem; font-weight: 700; padding: 0.2rem 0.5rem; border-radius: 4px; text-transform: uppercase;
    }
    .tag-green { background: #062e1b; color: #3fb950; border: 1px solid #1a5c32; }
    .tag-blue { background: #0c2d6b; color: #58a6ff; border: 1px solid #1f4b99; }
    
    h1 { font-size: 1.75rem; font-weight: 900; letter-spacing: -0.025em; color: #fff; }
    .subtitle { font-size: 0.8rem; color: var(--text-muted); margin-top: 0.25rem; }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 0.5rem;
      font-family: monospace;
      text-align: center;
    }
    .stat-box {
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 0.75rem;
      padding: 0.6rem 0.5rem;
    }
    .stat-label { font-size: 0.65rem; color: var(--text-muted); }
    .stat-value { font-size: 1.25rem; font-weight: 700; margin-top: 0.1rem; }
    
    .controls {
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }
    @media (min-width: 768px) {
      .controls { flex-direction: row; align-items: center; }
    }
    .search-input {
      width: 100%;
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 0.75rem;
      padding: 0.65rem 1rem;
      font-size: 0.875rem;
      color: #fff;
      outline: none;
      transition: border-color 0.2s;
    }
    .search-input:focus { border-color: var(--accent-s); }

    .tier-buttons {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      font-family: monospace;
      font-size: 0.75rem;
    }
    .tier-btn {
      background: #21262d;
      color: #c9d1d9;
      border: none;
      padding: 0.55rem 0.85rem;
      border-radius: 0.5rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .tier-btn.active {
      background: var(--accent-s);
      color: #fff;
    }
    
    .projects-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }
    @media (min-width: 768px) { .projects-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (min-width: 1024px) { .projects-grid { grid-template-columns: repeat(3, 1fr); } }

    .card {
      background: var(--card-bg);
      backdrop-filter: blur(10px);
      border: 1px solid var(--card-border);
      border-radius: 0.85rem;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 1rem;
      transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
    }
    .card:hover { transform: translateY(-2px); }
    .card-S { border-color: rgba(46, 160, 67, 0.6); box-shadow: 0 0 12px rgba(46, 160, 67, 0.15); }
    .card-A { border-color: rgba(56, 139, 253, 0.5); box-shadow: 0 0 12px rgba(56, 139, 253, 0.12); }
    .card-B { border-color: rgba(210, 153, 34, 0.4); }
    .card-C { border-color: rgba(48, 54, 61, 0.5); }

    .card-header { display: flex; justify-content: space-between; align-items: flex-start; gap: 0.5rem; }
    .project-title { font-size: 1.05rem; font-weight: 700; color: #fff; }
    .project-status { font-family: monospace; font-size: 0.7rem; color: var(--text-muted); }
    .rank-badge {
      font-family: monospace; font-weight: 900; font-size: 0.85rem; padding: 0.25rem 0.6rem; border-radius: 0.5rem; color: #fff;
    }
    .badge-S { background: var(--accent-s); }
    .badge-A { background: var(--accent-a); }
    .badge-B { background: var(--accent-b); }
    .badge-C { background: var(--accent-c); }

    .tier-pill {
      font-family: monospace; font-size: 0.65rem; padding: 0.15rem 0.4rem; border-radius: 4px; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted);
    }
    .project-purpose { font-size: 0.8rem; color: #c9d1d9; line-height: 1.4; }

    .card-footer {
      padding-top: 0.75rem; border-top: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;
    }
    .tags { display: flex; flex-wrap: wrap; gap: 0.35rem; }
    .tag { font-family: monospace; font-size: 0.65rem; padding: 0.15rem 0.45rem; border-radius: 4px; background: rgba(255,255,255,0.05); color: var(--text-muted); border: 1px solid rgba(255,255,255,0.08); }
    .file-count { font-family: monospace; font-size: 0.65rem; color: var(--text-muted); }
  </style>
</head>

    function render() {
      const grid = document.getElementById('projectsGrid');
      const filtered = projects.filter(p => {

        const q = searchQuery.toLowerCase();
        const matchesSearch = p.name.toLowerCase().includes(q) ||

                              p.tags.some(t => t.toLowerCase().includes(q));
        return matchesTier && matchesSearch;
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 4rem 0; color: #8b949e; font-family: monospace;">No matching projects found.</div>';

      currentTier = tier;
      document.querySelectorAll('.tier-btn').forEach(btn => btn.classList.remove('active'));
      const activeBtn = document.getElementById('btn-' + tier);
      if (activeBtn) activeBtn.classList.add('active');
      render();
    }

    document.getElementById('searchInput').addEventListener('input', (e) => {
      searchQuery = e.target.value;
      render();
    });

    render();
  </script>
</body>
</html>
